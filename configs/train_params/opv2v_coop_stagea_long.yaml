defaults:
  - default

seed: 0
max_num_of_imgs_per_gpu: 160
accum_iter: 1
epochs: 8
lr: 1e-5
min_lr: 1e-6
warmup_epochs: 0
weight_decay: 0.05
schedule_type: "linear_warmup_half_cycle_cosine_decay"
warn_not_in_submodule: False
amp: 1
amp_dtype: "bf16"
disable_cudnn_benchmark: true
freeze_val_samples_across_all_epochs: true
eval_freq: 1
save_freq: 1
keep_freq: 2
print_freq: 50
resume: False
submodule_configs:
  encoder:
    lr: 0
  agent_identity_embedding:
    lr: 5e-4
    min_lr: 5e-5
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  camera_identity_embedding:
    lr: 5e-4
    min_lr: 5e-5
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
