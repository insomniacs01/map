defaults:
  - default

# End-to-end finetuning geared towards BEV detection (with auxiliary geometry supervision).
max_num_of_imgs_per_gpu: 8
accum_iter: 2

epochs: 5
warmup_epochs: 1

lr: 5e-06
min_lr: 5e-08

save_freq: 1
eval_freq: 999
print_freq: 20

submodule_configs:
  # Freeze the DINOv2 image encoder for stability/memory.
  encoder:
    lr: 0

  # Finetune geometry + heads lightly.
  info_sharing:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}
  dpt_feature_head:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}
  dpt_regressor_head:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}
  pose_head:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}
  scale_head:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}

  ray_dirs_encoder:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}
  depth_encoder:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}
  depth_scale_encoder:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}
  cam_rot_encoder:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}
  cam_trans_encoder:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}
  cam_trans_scale_encoder:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}

  fusion_norm_layer:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}
  scale_token:
    lr: ${train_params.lr}
    min_lr: ${train_params.min_lr}

  # Train detection head more aggressively.
  det_head:
    lr: 0.0005
    min_lr: 0.00001
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: 0.0
    schedule_type: ${train_params.schedule_type}

