# Detection-only loss for OPV2V (ego CARLA/UE boxes) with a wider BEV range.
#
# Tweaks focal/heatmap weighting to push down medium-score negatives, improving
# AP/visuals without changing decoding.

train_criterion: "BEVCenternetDetLoss(x_range=(-50.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5, heatmap_weight=4.0, reg_weight=1.0, focal_alpha=1.0, focal_beta=4.0, min_gaussian_radius=1, max_gaussian_radius=6)"
test_criterion: "BEVCenternetDetLoss(x_range=(-50.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5, heatmap_weight=4.0, reg_weight=1.0, focal_alpha=1.0, focal_beta=4.0, min_gaussian_radius=1, max_gaussian_radius=6)"
