# Detection-only loss for OPV2V (ego CARLA/UE boxes) with a wider BEV range.
#
# Adds a small hard-negative mining term on the BEV heatmap to suppress high-score
# false positives that dominate dense decodes early in finetuning.

train_criterion: "BEVCenternetDetLoss(x_range=(-50.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5, heatmap_weight=2.0, reg_weight=1.0, min_gaussian_radius=1, max_gaussian_radius=6, hard_neg_topk=200, hard_neg_weight=0.5, hard_neg_ignore_tgt=0.1)"
test_criterion: "BEVCenternetDetLoss(x_range=(-50.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5, heatmap_weight=2.0, reg_weight=1.0, min_gaussian_radius=1, max_gaussian_radius=6, hard_neg_topk=200, hard_neg_weight=0.5, hard_neg_ignore_tgt=0.1)"
