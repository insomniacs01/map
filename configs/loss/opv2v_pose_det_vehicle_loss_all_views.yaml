# OPV2V cylindrical cooperative loss + BEV detection head supervision + extra vehicle-in-box point alignment (all views)
#
# This variant supervises vehicle points across all available views in the batch (view_indices=None) and averages the
# alignment term across those views. It is intended for finetuning runs where we want better vehicle reconstruction
# signals without relying solely on view0.

train_criterion: "ConfAndExcludeTopNPercentPixelLoss(FactoredGeometryScaleRegr3DPlusNormalGMLoss(RobustRegressionLoss(alpha=0.5, scaling_c=0.05), norm_mode='avg_dis', depth_type_for_loss='depth_along_ray', loss_in_log=True, flatten_across_image_only=True, cam_frame_points_loss_weight=1.0, depth_loss_weight=1.0, ray_directions_loss_weight=1.0, pose_quats_loss_weight=3.0, pose_trans_loss_weight=3.0, scale_loss_weight=1.0, compute_pairwise_relative_pose_loss=True, compute_world_frame_points_loss=True, world_frame_points_loss_weight=1.0, apply_normal_and_gm_loss_to_synthetic_data_only=True, normal_loss_weight=3.0, gm_loss_weight=3.0), conf_alpha=0.2, top_n_percent=5, apply_to_real_data_only=True, conf_loss_set_indices=[0], exclude_loss_set_indices=[1, 2]) + 0.3 * NonAmbiguousMaskLoss(BCELoss()) + 1.0 * BEVCenternetDetLoss(x_range=(0.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5) + 0.2 * VehicleBoxPointAlignmentLoss(box_margin=0.25, view_indices=None, max_vehicle_points_per_sample=20000, box_chunk_size=16, loss_type='smooth_l1', smooth_l1_beta=0.5, average_across_views=True)"

test_criterion: "ExcludeTopNPercentPixelLoss(FactoredGeometryScaleRegr3DPlusNormalGMLoss(RobustRegressionLoss(alpha=0.5, scaling_c=0.05), norm_mode='avg_dis', depth_type_for_loss='depth_along_ray', loss_in_log=True, flatten_across_image_only=True, cam_frame_points_loss_weight=1.0, depth_loss_weight=1.0, ray_directions_loss_weight=1.0, pose_quats_loss_weight=3.0, pose_trans_loss_weight=3.0, scale_loss_weight=1.0, compute_pairwise_relative_pose_loss=True, compute_world_frame_points_loss=True, world_frame_points_loss_weight=1.0, apply_normal_and_gm_loss_to_synthetic_data_only=True, normal_loss_weight=3.0, gm_loss_weight=3.0), top_n_percent=5, apply_to_real_data_only=True, loss_set_indices=[0, 1, 2]) + 0.3 * NonAmbiguousMaskLoss(BCELoss()) + 1.0 * BEVCenternetDetLoss(x_range=(0.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5) + 0.2 * VehicleBoxPointAlignmentLoss(box_margin=0.25, view_indices=None, max_vehicle_points_per_sample=20000, box_chunk_size=16, loss_type='smooth_l1', smooth_l1_beta=0.5, average_across_views=True)"

