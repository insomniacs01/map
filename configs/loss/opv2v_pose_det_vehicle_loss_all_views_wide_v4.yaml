# OPV2V pose/geometry finetuning + BEV detection supervision (wide range) + vehicle-in-box point alignment (all views).
#
# v4: boost vehicle geometry supervision so more GT vehicles actually have reconstructed points
# inside their 3D boxes (this is a hard bottleneck for BEV detection recall when the det head
# only sees reconstructed points).
#
# Key change vs v3:
# - Stronger `VehicleBoxPointAlignmentLoss` (2.0x) and slightly larger box margin to cover more pixels.

train_criterion: "ConfAndExcludeTopNPercentPixelLoss(FactoredGeometryScaleRegr3DPlusNormalGMLoss(RobustRegressionLoss(alpha=0.5, scaling_c=0.05), norm_mode='avg_dis', depth_type_for_loss='depth_along_ray', loss_in_log=True, flatten_across_image_only=True, cam_frame_points_loss_weight=1.0, depth_loss_weight=1.0, ray_directions_loss_weight=1.0, pose_quats_loss_weight=3.0, pose_trans_loss_weight=3.0, scale_loss_weight=1.0, compute_pairwise_relative_pose_loss=True, compute_world_frame_points_loss=True, world_frame_points_loss_weight=1.0, apply_normal_and_gm_loss_to_synthetic_data_only=True, normal_loss_weight=3.0, gm_loss_weight=3.0), conf_alpha=0.2, top_n_percent=5, apply_to_real_data_only=True, conf_loss_set_indices=[0], exclude_loss_set_indices=[1, 2]) + 0.3 * NonAmbiguousMaskLoss(BCELoss()) + 6.0 * BEVCenternetDetLoss(x_range=(-50.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5, heatmap_weight=4.0, reg_weight=1.0, focal_alpha=1.0, focal_beta=4.0, min_gaussian_radius=1, max_gaussian_radius=8, hard_neg_topk=200, hard_neg_weight=0.2, hard_neg_ignore_tgt=0.1) + 2.0 * VehicleBoxPointAlignmentLoss(box_margin=0.5, view_indices=None, max_vehicle_points_per_sample=50000, box_chunk_size=16, loss_type='smooth_l1', smooth_l1_beta=0.5, average_across_views=True)"

test_criterion: "ExcludeTopNPercentPixelLoss(FactoredGeometryScaleRegr3DPlusNormalGMLoss(RobustRegressionLoss(alpha=0.5, scaling_c=0.05), norm_mode='avg_dis', depth_type_for_loss='depth_along_ray', loss_in_log=True, flatten_across_image_only=True, cam_frame_points_loss_weight=1.0, depth_loss_weight=1.0, ray_directions_loss_weight=1.0, pose_quats_loss_weight=3.0, pose_trans_loss_weight=3.0, scale_loss_weight=1.0, compute_pairwise_relative_pose_loss=True, compute_world_frame_points_loss=True, world_frame_points_loss_weight=1.0, apply_normal_and_gm_loss_to_synthetic_data_only=True, normal_loss_weight=3.0, gm_loss_weight=3.0), top_n_percent=5, apply_to_real_data_only=True, loss_set_indices=[0, 1, 2]) + 0.3 * NonAmbiguousMaskLoss(BCELoss()) + 6.0 * BEVCenternetDetLoss(x_range=(-50.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5, heatmap_weight=4.0, reg_weight=1.0, focal_alpha=1.0, focal_beta=4.0, min_gaussian_radius=1, max_gaussian_radius=8, hard_neg_topk=200, hard_neg_weight=0.2, hard_neg_ignore_tgt=0.1) + 2.0 * VehicleBoxPointAlignmentLoss(box_margin=0.5, view_indices=None, max_vehicle_points_per_sample=50000, box_chunk_size=16, loss_type='smooth_l1', smooth_l1_beta=0.5, average_across_views=True)"

