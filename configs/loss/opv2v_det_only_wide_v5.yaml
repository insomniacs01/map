# Detection-only loss for OPV2V (ego CARLA/UE boxes) with a wider BEV range.
#
# Goal: reduce dense false positives while keeping recall.
# - Stronger heatmap weighting + focal(alpha=1) to penalize medium-score negatives.
# - Slightly larger gaussian support to make center supervision less brittle.
# - Mild hard-negative mining to push down top-scoring empty-cell peaks.

train_criterion: "BEVCenternetDetLoss(x_range=(-50.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5, heatmap_weight=4.0, reg_weight=1.0, focal_alpha=1.0, focal_beta=4.0, min_gaussian_radius=1, max_gaussian_radius=8, hard_neg_topk=200, hard_neg_weight=0.2, hard_neg_ignore_tgt=0.1)"
test_criterion: "BEVCenternetDetLoss(x_range=(-50.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5, heatmap_weight=4.0, reg_weight=1.0, focal_alpha=1.0, focal_beta=4.0, min_gaussian_radius=1, max_gaussian_radius=8, hard_neg_topk=200, hard_neg_weight=0.2, hard_neg_ignore_tgt=0.1)"

