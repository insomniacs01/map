# OPV2V pose/geometry finetuning + BEV detection supervision (wide range) + vehicle-in-box point alignment (all views).
#
# Detection is treated as the primary objective; geometry losses keep the point cloud stable.
# This variant uses a stronger heatmap configuration (focal_alpha=1, heatmap_weight=4).

train_criterion: "ConfAndExcludeTopNPercentPixelLoss(FactoredGeometryScaleRegr3DPlusNormalGMLoss(RobustRegressionLoss(alpha=0.5, scaling_c=0.05), norm_mode='avg_dis', depth_type_for_loss='depth_along_ray', loss_in_log=True, flatten_across_image_only=True, cam_frame_points_loss_weight=1.0, depth_loss_weight=1.0, ray_directions_loss_weight=1.0, pose_quats_loss_weight=3.0, pose_trans_loss_weight=3.0, scale_loss_weight=1.0, compute_pairwise_relative_pose_loss=True, compute_world_frame_points_loss=True, world_frame_points_loss_weight=1.0, apply_normal_and_gm_loss_to_synthetic_data_only=True, normal_loss_weight=3.0, gm_loss_weight=3.0), conf_alpha=0.2, top_n_percent=5, apply_to_real_data_only=True, conf_loss_set_indices=[0], exclude_loss_set_indices=[1, 2]) + 0.3 * NonAmbiguousMaskLoss(BCELoss()) + 3.0 * BEVCenternetDetLoss(x_range=(-50.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5, heatmap_weight=4.0, reg_weight=1.0, focal_alpha=1.0, focal_beta=4.0, min_gaussian_radius=1, max_gaussian_radius=6) + 0.2 * VehicleBoxPointAlignmentLoss(box_margin=0.25, view_indices=None, max_vehicle_points_per_sample=20000, box_chunk_size=16, loss_type='smooth_l1', smooth_l1_beta=0.5, average_across_views=True)"

test_criterion: "ExcludeTopNPercentPixelLoss(FactoredGeometryScaleRegr3DPlusNormalGMLoss(RobustRegressionLoss(alpha=0.5, scaling_c=0.05), norm_mode='avg_dis', depth_type_for_loss='depth_along_ray', loss_in_log=True, flatten_across_image_only=True, cam_frame_points_loss_weight=1.0, depth_loss_weight=1.0, ray_directions_loss_weight=1.0, pose_quats_loss_weight=3.0, pose_trans_loss_weight=3.0, scale_loss_weight=1.0, compute_pairwise_relative_pose_loss=True, compute_world_frame_points_loss=True, world_frame_points_loss_weight=1.0, apply_normal_and_gm_loss_to_synthetic_data_only=True, normal_loss_weight=3.0, gm_loss_weight=3.0), top_n_percent=5, apply_to_real_data_only=True, loss_set_indices=[0, 1, 2]) + 0.3 * NonAmbiguousMaskLoss(BCELoss()) + 3.0 * BEVCenternetDetLoss(x_range=(-50.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5, heatmap_weight=4.0, reg_weight=1.0, focal_alpha=1.0, focal_beta=4.0, min_gaussian_radius=1, max_gaussian_radius=6) + 0.2 * VehicleBoxPointAlignmentLoss(box_margin=0.25, view_indices=None, max_vehicle_points_per_sample=20000, box_chunk_size=16, loss_type='smooth_l1', smooth_l1_beta=0.5, average_across_views=True)"

