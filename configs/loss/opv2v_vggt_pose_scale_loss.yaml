# OPV2V finetuning loss for VGGT (scale-aware, pose-supervised).
#
# Notes:
# - VGGT itself is scale-ambiguous. We enable the scale regression loss term and (optionally)
#   train a lightweight `metric_scale_head` in `VGGTWrapper` that outputs `metric_scaling_factor`.
# - VGGT predictions are not guaranteed to be expressed in the GT view0 frame, so we set
#   `convert_predictions_to_view0_frame=true` to make losses comparable.

# Training Loss
train_criterion: "ConfAndExcludeTopNPercentPixelLoss(FactoredGeometryScaleRegr3DPlusNormalGMLoss(RobustRegressionLoss(alpha=0.5, scaling_c=0.05), norm_mode='avg_dis', depth_type_for_loss='depth_along_ray', loss_in_log=True, flatten_across_image_only=True, cam_frame_points_loss_weight=1.0, depth_loss_weight=1.0, ray_directions_loss_weight=1.0, pose_quats_loss_weight=3.0, pose_trans_loss_weight=3.0, scale_loss_weight=1.0, compute_pairwise_relative_pose_loss=True, convert_predictions_to_view0_frame=True, compute_world_frame_points_loss=True, world_frame_points_loss_weight=1.0, apply_normal_and_gm_loss_to_synthetic_data_only=True, normal_loss_weight=3.0, gm_loss_weight=3.0), conf_alpha=0.2, top_n_percent=5, apply_to_real_data_only=True, conf_loss_set_indices=[0], exclude_loss_set_indices=[1, 2])"

# Validation Loss mirrors training (without confidence regularization) to measure pose+scale quality
test_criterion: "ExcludeTopNPercentPixelLoss(FactoredGeometryScaleRegr3DPlusNormalGMLoss(RobustRegressionLoss(alpha=0.5, scaling_c=0.05), norm_mode='avg_dis', depth_type_for_loss='depth_along_ray', loss_in_log=True, flatten_across_image_only=True, cam_frame_points_loss_weight=1.0, depth_loss_weight=1.0, ray_directions_loss_weight=1.0, pose_quats_loss_weight=3.0, pose_trans_loss_weight=3.0, scale_loss_weight=1.0, compute_pairwise_relative_pose_loss=True, convert_predictions_to_view0_frame=True, compute_world_frame_points_loss=True, world_frame_points_loss_weight=1.0, apply_normal_and_gm_loss_to_synthetic_data_only=True, normal_loss_weight=3.0, gm_loss_weight=3.0), top_n_percent=5, apply_to_real_data_only=True, loss_set_indices=[0, 1, 2])"
