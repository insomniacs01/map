# Detection-only loss for OPV2V (ego CARLA/UE boxes).
#
# Use this for fast det-head warmup runs where we want the training signal to focus on box prediction.

train_criterion: "1.0 * BEVCenternetDetLoss(x_range=(0.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5)"
test_criterion: "1.0 * BEVCenternetDetLoss(x_range=(0.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5)"

