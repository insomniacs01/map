# OPV2V finetuning loss for VGGT (metric pose+depth supervision) with stronger
# direct metric relative-pose supervision to stabilize large-baseline coop.
#
# Key switch: `norm_mode='?avg_dis'` disables normalization for metric samples,
# preserving absolute scale (meters) for OPV2V.

train_criterion: "ConfAndExcludeTopNPercentPixelLoss(FactoredGeometryRegr3DPlusNormalGMLoss(RobustRegressionLoss(alpha=0.5, scaling_c=0.05), norm_mode='?avg_dis', gt_scale=True, depth_type_for_loss='depth_along_ray', loss_in_log=True, flatten_across_image_only=True, cam_frame_points_loss_weight=1.0, depth_loss_weight=1.0, ray_directions_loss_weight=1.0, pose_quats_loss_weight=3.0, pose_trans_loss_weight=3.0, compute_pairwise_relative_pose_loss=True, convert_predictions_to_view0_frame=True, compute_world_frame_points_loss=True, world_frame_points_loss_weight=1.0, apply_normal_and_gm_loss_to_synthetic_data_only=True, normal_loss_weight=3.0, gm_loss_weight=3.0), conf_alpha=0.2, top_n_percent=5, apply_to_real_data_only=True, conf_loss_set_indices=[0], exclude_loss_set_indices=[1, 2]) + 0.5 * RelativePoseMetricLoss(only_cross_agent=False, trans_weight=1.0, rot_weight=0.0, squared=False)"

test_criterion: "ExcludeTopNPercentPixelLoss(FactoredGeometryRegr3DPlusNormalGMLoss(RobustRegressionLoss(alpha=0.5, scaling_c=0.05), norm_mode='?avg_dis', gt_scale=True, depth_type_for_loss='depth_along_ray', loss_in_log=True, flatten_across_image_only=True, cam_frame_points_loss_weight=1.0, depth_loss_weight=1.0, ray_directions_loss_weight=1.0, pose_quats_loss_weight=3.0, pose_trans_loss_weight=3.0, compute_pairwise_relative_pose_loss=True, convert_predictions_to_view0_frame=True, compute_world_frame_points_loss=True, world_frame_points_loss_weight=1.0, apply_normal_and_gm_loss_to_synthetic_data_only=True, normal_loss_weight=3.0, gm_loss_weight=3.0), top_n_percent=5, apply_to_real_data_only=True, loss_set_indices=[0, 1, 2]) + 0.5 * RelativePoseMetricLoss(only_cross_agent=False, trans_weight=1.0, rot_weight=0.0, squared=False)"

