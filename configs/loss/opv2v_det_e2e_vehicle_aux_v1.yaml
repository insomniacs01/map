# End-to-end finetuning loss for OPV2V with BEV detection as the primary objective,
# plus a light vehicle-in-box point alignment auxiliary to keep geometry sane.

train_criterion: "2.0 * BEVCenternetDetLoss(x_range=(-50.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5, heatmap_weight=4.0, reg_weight=1.0, focal_alpha=1.0, focal_beta=4.0, min_gaussian_radius=1, max_gaussian_radius=6) + 0.2 * VehicleBoxPointAlignmentLoss(box_margin=0.25, view_indices=None, max_vehicle_points_per_sample=20000, box_chunk_size=16, loss_type='smooth_l1', smooth_l1_beta=0.5, average_across_views=True)"

test_criterion: "2.0 * BEVCenternetDetLoss(x_range=(-50.0, 120.0), y_range=(-50.0, 50.0), voxel_size=0.5, heatmap_weight=4.0, reg_weight=1.0, focal_alpha=1.0, focal_beta=4.0, min_gaussian_radius=1, max_gaussian_radius=6) + 0.2 * VehicleBoxPointAlignmentLoss(box_margin=0.25, view_indices=None, max_vehicle_points_per_sample=20000, box_chunk_size=16, loss_type='smooth_l1', smooth_l1_beta=0.5, average_across_views=True)"

