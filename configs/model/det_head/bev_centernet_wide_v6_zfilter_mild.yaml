enabled: true

# Det-head-only finetuning: stop gradient into MapAnything points.
stop_gradient: true

# Do not use predicted non-ambiguous mask as point weights; OPV2V vehicles can be ambiguous.
use_pred_mask: false

# Avoid weighting by predicted confidence: vehicle points can be low-confidence.
use_pred_conf: false

# Mild height filtering (ego CARLA/UE Z) to reduce extreme clutter.
point_z_min: -1.0
point_z_max: 3.0

# Use GT camera poses to align camera-frame points to ego for BEV rasterization.
point_pose_source: gt

# BEV grid settings (ego CARLA/UE: X forward, Y right).
x_range: [-50.0, 120.0]
y_range: [-50.0, 50.0]
voxel_size: 0.5

# Point subsampling (weight-aware in rasterizer).
max_points: 200000

# Extra BEV channels to reduce false positives on flat ground regions.
include_high_ratio: true
z_high_threshold: 0.5
include_var_z: true

# Head capacity
hidden_channels: 128
num_conv: 4

# Lower initial objectness to avoid dense early predictions.
heatmap_bias: -4.0

